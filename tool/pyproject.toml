[project]
name = "commonplace"
version = "0.1.0"
description = "Bring bookmarks into a git-lex commonplace and fetch their pages as readable markdown."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=2.0",
]

[project.scripts]
commonplace = "commonplace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
