[project]
name = "lex-bookmark"
version = "0.1.0"
description = "Bring bookmarks into a git-lex bookmark library and fetch their pages as readable markdown."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=2.0",
]

[project.scripts]
lex-bookmark = "lex_bookmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
