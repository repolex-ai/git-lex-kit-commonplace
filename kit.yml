# git-lex kit configuration
# Commonplace kit — a commonplace book that keeps itself: saved links come in,
# their pages are fetched as text, and an agent assesses and connects them.

name: commonplace

# Domain kit: a commonplace is its own repo, set up with
# `git lex init --kit commonplace`.
scope: domain

# Folder installation — create class folders from the ontology.
install folders: true
folder base: Commonplace
folder ontology: commonplace.ttl

init_prompts:
  - agent_name
